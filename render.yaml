# Render Blueprint for the Pareil API (free web service). Secrets are entered in the Render
# dashboard on first deploy (sync: false); no values are committed here.
services:
  - type: web
    name: pareil-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        sync: false  # e.g. https://pareil.vercel.app (comma-separated, no trailing slash)
